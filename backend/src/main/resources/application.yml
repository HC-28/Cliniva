# ============================================================
#   CLINIVA — Enterprise Healthcare Platform
#   Backend Configuration
#   DO NOT commit sensitive values to version control.
#   Use environment variables in production.
# ============================================================

spring:
  application:
    name: cliniva-platform

  # ── PostgreSQL Database ──────────────────────────────────
  datasource:
    url: ${CLINIVA_DB_URL:jdbc:postgresql://localhost:5432/cliniva_db}
    driver-class-name: org.postgresql.Driver
    username: ${CLINIVA_DB_USER:postgres}
    password: ${CLINIVA_DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: ClinivaHikariPool

  # ── JPA / Hibernate ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: cliniva
        enable_lazy_load_no_trans: true
    defer-datasource-initialization: true

  # ── Mail Service (Optional) ──────────────────────────────
  mail:
    host: ${CLINIVA_MAIL_HOST:smtp.gmail.com}
    port: ${CLINIVA_MAIL_PORT:587}
    username: ${CLINIVA_MAIL_USERNAME:}
    password: ${CLINIVA_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── Logging ──────────────────────────────────────────────
logging:
  level:
    com.cliniva: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} — %msg%n"

# ── JWT ───────────────────────────────────────────────────
# JwtTokenProvider reads: cliniva.jwt.secret & cliniva.jwt.expiration-seconds
cliniva:
  jwt:
    secret: ${CLINIVA_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-seconds: ${CLINIVA_JWT_EXPIRATION_SECONDS:3600}

  storage:
    local:
      upload-dir: ${CLINIVA_UPLOAD_DIR:./cliniva-uploads}
      max-file-size: ${CLINIVA_MAX_FILE_SIZE:10MB}

  platform:
    name: Cliniva
    version: 1.0.0
    frontend-url: http://localhost:5173

# ── Actuator / Health ─────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
