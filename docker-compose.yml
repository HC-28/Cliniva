version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cliniva-db
    environment:
      POSTGRES_DB: cliniva_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password  # Make sure this matches your .env if running backend locally
    ports:
      - "5432:5432"
    volumes:
      - cliniva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cliniva_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cliniva-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cliniva_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

volumes:
  cliniva_postgres_data:
